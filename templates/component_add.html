<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>New System Component — Add</title>
  <link rel="stylesheet" href="/static/css/availability.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-content">
      <div class="add-page">
        <header class="add-page__header">
          <div class="brand">
            <img
              class="brand__mark"
              src="http://localhost:9001/api/v1/download-shared-object/aHR0cDovLzEyNy4wLjAuMTo5MDAwL21lZGlhLyVEMSU4MyVEMCVCMSVEMCVCQiVEMSU4RSVEMCVCNCVEMSU4MSVEMCVCQSVEMCVCMCVEMSU4RiUyMCVEMSU4NSVEMSU4MyVEMCVCOSVEMCVCRCVEMSU4Ri1QaG90b3Jvb20ucG5nP1gtQW16LUFsZ29yaXRobT1BV1M0LUhNQUMtU0hBMjU2JlgtQW16LUNyZWRlbnRpYWw9R0NRM0xZWlVLNjRPWFA2RlZGMUslMkYyMDI2MDkwMiUyRnVzLWVhc3QtMSUyRnMzJTJGYXdzNF9yZXF1ZXN0JlgtQW16LURhdGU9MjAyNjA5MDJUMTEwMjM1WiZYLUFtei1FeHBpcmVzPTQzMjAwJlgtQW16LVNlY3VyaXR5LVRva2VuPWV5SmhiR2NpT2lKSVV6VXhNaUlzSW5SNWNDSTZJa3BYVkNKOS5leUpoWTJObGMzTkxaWGtpT2lKSFExRXpURmxhVlVzMk5FOVlVRFpHVmtZeFN5SXNJbVY0Y0NJNk1UYzRPRE00TmpZeE9Dd2ljR0Z5Wlc1MElqb2ljbTl2ZENKOS5xT3NNT3J6ZFpkU1BVQUFnQ2NVcHY1My1mbTZqRGxBV1JiTTdnd0NzRnBFdC1DMXhUT01FVmNDdzFjdmo0MlVrUnBCMWtYM3g5aGIxSUw1VHA2M1E4USZYLUFtei1TaWduZWRIZWFkZXJzPWhvc3QmdmVyc2lvbklkPW51bGwmWC1BbXotU2lnbmF0dXJlPTljMWNhOTU1ZDkxZDI0M2I3ZWJhZjhjODI0NDRjODI3MTc0ZmNiZTE1NWNlZTllNDIwNGY0ZWYyY2Q2MGYwODA"
              alt="ManageEngine"
            >
            <span class="brand__name">ManageEngine</span>
          </div>
          <span class="status-badge status-badge--draft">{{.Component.Status}}</span>
        </header>

        <h1 class="add-page__title">New System Component</h1>
        <p class="add-page__subtitle">Configure a new element for the infrastructure evaluation suite.</p>

        {{if .Component.ImageURL}}
        <div class="draft-preview">
          <img src="{{.Component.ImageURL}}" alt="{{.Component.Name}}">
        </div>
        {{end}}
        {{if .Component.VideoURL}}
        <div class="draft-preview">
          <video src="{{.Component.VideoURL}}" poster="{{.Component.ImageURL}}" muted loop playsinline controls></video>
        </div>
        {{end}}

        <label class="upload-zone" for="component_image">
          <span class="upload-zone__icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v8.6l3.2-3.2a1 1 0 0 1 1.4 0L14 16l2.3-2.3a1 1 0 0 1 1.4 0L19 14.6V6H5zm3.5 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
          </span>
          <span class="upload-zone__label">Upload Component Image</span>
          <span class="upload-zone__hint">PNG, JPG up to 5MB</span>
          <input id="component_image" name="component_image" type="file" accept="image/png,image/jpeg">
        </label>

        <label class="upload-zone" for="evaluation_video">
          <span class="upload-zone__icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 4h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 1.5V9h3.5L14 5.5zM8 13h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
          </span>
          <span class="upload-zone__label">Upload Evaluation Video</span>
          <span class="upload-zone__hint">MP4, WebM up to 50MB</span>
          <input id="evaluation_video" name="evaluation_video" type="file" accept="video/mp4,video/webm">
        </label>

        <form class="form-card" action="#" method="get">
          <div class="form-field">
            <label class="form-field__label" for="component_name">Component Name</label>
            <input
              class="form-field__control"
              id="component_name"
              name="component_name"
              type="text"
              placeholder="e.g. Web Server Node Alpha"
              value="{{.Component.Name}}"
            >
          </div>

          <div class="form-field">
            <label class="form-field__label" for="component_description">Component Description</label>
            <textarea
              class="form-field__control"
              id="component_description"
              name="component_description"
              placeholder="Enter technical specifications..."
            >{{.Component.Description}}</textarea>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="config_type_select">Configuration Type</label>
            <select class="form-field__control" id="config_type_select" name="config_type">
              <option value="Single Node"{{if eq .Component.ConfigType "Single Node"}} selected{{end}}>Single Node</option>
              <option value="Replication"{{if eq .Component.ConfigType "Replication"}} selected{{end}}>Replication</option>
              <option value="Clustering"{{if eq .Component.ConfigType "Clustering"}} selected{{end}}>Clustering</option>
            </select>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="uptime_input">Estimated Uptime</label>
            <div class="form-field__uptime">
              <input
                class="form-field__control"
                id="uptime_input"
                name="uptime_percent"
                type="number"
                step="0.01"
                min="0"
                max="100"
                placeholder="99.99"
                value="{{printf "%.2f" .Component.UptimePercent}}"
              >
              <span class="form-field__suffix">%</span>
            </div>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="system_impact_select">System Impact</label>
            <select class="form-field__control" id="system_impact_select" name="system_impact">
              <option value="Low"{{if eq .Component.SystemImpact "Low"}} selected{{end}}>Low</option>
              <option value="Medium"{{if eq .Component.SystemImpact "Medium"}} selected{{end}}>Medium</option>
              <option value="High"{{if eq .Component.SystemImpact "High"}} selected{{end}}>High</option>
            </select>
          </div>

          <div class="form-actions">
            <button class="btn btn--primary" type="submit">Save Draft</button>
            <a class="btn btn--secondary" href="/components">Cancel</a>
          </div>
        </form>
      </div>
    </main>

    {{template "tab_bar" .}}
  </div>
</body>
</html>
